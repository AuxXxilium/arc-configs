name: Build Configs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version"
        required: false
        type: string
      latest:
        description: "latest"
        default: true
        type: boolean
      prerelease:
        description: "pre release"
        default: false
        type: boolean

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Init Env
        run: |
          git config --global user.email "info@auxxxilium.tech"
          git config --global user.name "AuxXxilium"
          sudo timedatectl set-timezone "Europe/Berlin" 

      - name: Calculate version
        run: |
          # Calculate Version
          VERSION=""
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="`date +'%y.%m.%d'`"
          fi

          if [ -n "${VERSION}" ]; then
            # Modify Source File
            echo "Version: ${VERSION}"
            echo "${VERSION}" >VERSION
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
          fi

      - name: Update data.yml
        run: |
          # With its certificate checked, and it has to be there: Arc checks the
          # DSM boot files it downloads against the zimage/ramdisk sums in this
          # file and refuses them without, so a release without it, or with a
          # data.yml from before arc-dsm listed them, would stop every build
          # that has to fetch them. Run arc-dsm's "Rebuild Data" first then.
          curl -fsSL --proto '=https' "https://raw.githubusercontent.com/AuxXxilium/arc-dsm/refs/heads/new/data.yml" -o "data.yml" \
            || { echo "::error::data.yml could not be fetched from arc-dsm"; exit 1; }
          FILESIZE=$(stat -c%s "data.yml")
          if [ "${FILESIZE}" -lt 3072 ]; then
            echo "::error::data.yml from arc-dsm is only ${FILESIZE} bytes"
            exit 1
          fi
          if ! grep -q '^      zimage: "[0-9a-f]\{64\}"' data.yml || ! grep -q '^      ramdisk: "[0-9a-f]\{64\}"' data.yml; then
            echo "::error::data.yml from arc-dsm lists no zimage/ramdisk SHA-256 yet - run arc-dsm's Rebuild Data first"
            exit 1
          fi

      - name: Build Configs Package
        run: |
          # Build Configs Package
          zip -9j configs-${{ env.VERSION }}.zip *.yml VERSION

      - name: Release Configs
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1.14.0
        with:
          name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          makeLatest: ${{ inputs.latest }}
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          artifacts: |
            configs-*.zip
